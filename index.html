const $=s=>document.querySelector(s),app=$('#app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let saved;try{saved=JSON.parse(localStorage.getItem('bab4-v1'))||{name:'',runs:[]}}catch{saved={name:'',runs:[]}}let storageOK=true;function persist(){try{localStorage.setItem('bab4-v1',JSON.stringify(saved))}catch{storageOK=false}}const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const words=[['🦠','Patogen','病原体','Menyebabkan penyakit.','引起疾病。'],['🤧','Titisan air','飞沫','Patogen boleh disebarkan melalui titisan air.','病原体可通过飞沫传播。'],['🦟','Vektor','病媒','Nyamuk Aedes ialah vektor demam denggi.','伊蚊是登革热的传播媒介。'],['🛡️','Kulit','皮肤','Kulit menghalang kemasukan patogen.','皮肤阻止病原体进入。'],['⚪ 🦠','Fagositosis','吞噬作用','Sel darah putih menelan dan mencernakan patogen.','白细胞吞入并消化病原体。'],['🛡️ 🦠','Antibodi','抗体','Antibodi bertindak secara spesifik terhadap antigen.','抗体针对特定抗原发挥作用。'],['💉','Vaksin','疫苗','Vaksin merangsang badan menghasilkan antibodi.','疫苗刺激身体产生抗体。'],['💪 🛡️','Keimunan aktif','主动免疫','Badan menghasilkan antibodi sendiri.','身体自己产生抗体。'],['🤱','Keimunan pasif','被动免疫','Badan menerima antibodi daripada sumber luar.','身体接收外来的抗体。'],['💧','Air tercemar','受污染的水','Kolera boleh merebak melalui air tercemar.','霍乱可通过受污染的水传播。'],['🧣','Barangan peribadi','私人物品','Jangan berkongsi tuala dan pakaian.','不要共用毛巾和衣服。'],['🧼','Mencuci tangan','洗手','Cuci tangan dengan sabun sebelum makan.','饭前用肥皂洗手。'],['🫧','Mukus','黏液','Mukus memerangkap mikroorganisma.','黏液困住微生物。'],['🤱 🛡️','Plasenta dan susu ibu','胎盘和母乳','Bayi boleh menerima antibodi daripada ibu.','婴儿可从母亲获得抗体。'],['💉 🛡️','Antiserum','抗血清','Antiserum mengandungi antibodi.','抗血清含有现成抗体。']];
const bank=[];function add(type,prompt,answer,choices,cn,ex,icon){bank.push({id:bank.length,type,prompt,answer,choices,cn,ex,icon})}
words.slice(0,9).forEach(w=>add('picture',`Pilih istilah bagi: ${w[2]}`,w[1],words.filter(x=>x!==w).map(x=>x[1]),w[2],w[3]+' '+w[4],w[0]));
[['Pesakit bersin. Orang lain menyedut titisan air.','Udara / titisan air','病人打喷嚏，别人吸入飞沫。','飞沫可携带病原体。','🤧'],['Minum air sungai yang tercemar.','Air','饮用受污染的河水。','受污染的水可能携带病原体。','💧'],['Berkongsi tuala yang tercemar oleh kulat.','Sentuhan','共用被真菌污染的毛巾。','共用私人物品属于间接接触。','🧣'],['Digigit nyamuk Aedes yang membawa virus denggi.','Vektor','被携带登革病毒的伊蚊叮咬。','伊蚊是病媒，病毒是病原体。','🦟'],['Berkongsi sikat yang tercemar oleh kulat.','Sentuhan','共用被真菌污染的梳子。','梳子可以成为间接接触传播的物品。','🪮'],['Makan makanan yang dicemari patogen daripada air.','Air','吃了被受污染的水污染的食物。','食物和水都可能把病原体带入身体。','🥣']].forEach(x=>add('classify',x[0],x[1],['Udara / titisan air','Air','Sentuhan','Vektor'].filter(v=>v!==x[1]),x[2],x[3],x[4]));
[['Vaksin merangsang badan menghasilkan ____.','antibodi','疫苗刺激身体产生什么？','抗体由身体自己产生。'],['Kulit ____ kemasukan patogen.','menghalang','皮肤怎样防御病原体？','Menghalang＝阻止。'],['Mukus ____ mikroorganisma.','memerangkap','黏液对微生物有什么作用？','Memerangkap＝困住。'],['Sel darah putih menelan dan ____ patogen.','mencernakan','白细胞吞入后怎样处理病原体？','Mencernakan＝消化。'],['Keimunan ____ melibatkan penerimaan antibodi dari luar.','pasif','接收外来抗体属于什么免疫？','Pasif＝被动；aktif＝自己产生。'],['Keimunan ____ berlaku apabila badan menghasilkan antibodi sendiri.','aktif','身体自己产生抗体属于什么免疫？','Aktif＝主动。'],['Nyamuk Aedes ialah ____ bagi demam denggi.','vektor','伊蚊在登革热传播中是什么角色？','Vektor＝病媒；patogen＝病原体。'],['Antiserum mengandungi ____ yang sedia ada.','antibodi','抗血清含有什么现成的物质？','抗血清提供抗体，属于人工被动免疫。']].forEach(x=>add('fill',x[0],x[1],['antibodi','menghalang','memerangkap','mencernakan','pasif','aktif','vektor'].filter(v=>v!==x[1]),x[2],x[3],'📝'));
add('order','Susun proses fagositosis.',['Mendekati','Mengelilingi','Menelan','Mencernakan'],null,'排列吞噬作用：靠近、包围、吞入、消化。','白细胞先靠近并包围病原体，再吞入，最后消化。','⚪ 🦠');add('order','Susun tindak balas selepas pemvaksinan.',['Vaksin diberikan','Sistem imun dirangsang','Antibodi dihasilkan'],null,'排列接种疫苗后的反应。','疫苗刺激免疫系统，身体随后产生抗体。','💉');add('order','Susun penularan melalui nyamuk.',['Nyamuk membawa patogen','Nyamuk menggigit individu sihat','Patogen memasuki badan'],null,'排列蚊子传播病原体的过程。','带病原体的蚊子叮咬健康的人，病原体进入身体。','🦟');
add('short','Bagaimanakah vaksin membantu melindungi badan?','Vaksin merangsang badan menghasilkan antibodi.',null,'疫苗怎样帮助保护身体？','得分词：merangsang（刺激）、menghasilkan antibodi（产生抗体）。','💉');add('short','Apakah fungsi kulit dalam pertahanan badan?','Kulit menghalang kemasukan patogen.',null,'皮肤在身体防御中有什么作用？','得分词：menghalang（阻止）、kemasukan patogen（病原体进入）。','🛡️');add('short','Apakah yang dilakukan oleh sel darah putih semasa fagositosis?','Sel darah putih menelan dan mencernakan patogen.',null,'吞噬作用中，白细胞做什么？','得分词：menelan（吞入）、mencernakan（消化）、patogen（病原体）。','⚪ 🦠');
let deck=[],pos=0,results=[],chosen=[],locked=false,isReview=false,mode='mixed';const types={picture:'看图认词',classify:'情境分类',fill:'句子填空',order:'步骤排序',short:'一句简答'};
function home(){app.innerHTML=`<div class="hero"><div><div class="eyebrow">FORM 2 / BAB 4</div><h1>健康知识，<br>一步一步学。</h1><p class="muted">Kesihatan Manusia · 人类健康<br>看懂画面，再认马来文，最后自己作答。</p><span class="pill">每轮10题</span> <span class="pill">马来文 + 华文</span></div><div class="art" aria-label="保护身体抵抗病原体">🛡️ 🦠 💧</div></div><div class="panel"><label for="name">学生名字 / Nama</label><input id="name" maxlength="40" placeholder="输入名字，开始学习" value="${esc(saved.name)}"><div class="row"><button class="primary" onclick="begin('mixed')">开始10题练习</button><button onclick="saveName();study(0)">先学15张认词卡</button></div><p class="small">建议：先学5张卡，再开始练习。成绩和错题保存在目前的浏览器；不同手机不会同步。</p></div><p class="eyebrow" style="margin-top:28px">专项练习 / LATIHAN</p><div class="cards">${Object.entries(types).map(([k,v],i)=>`<button onclick="begin('${k}')"><strong>${['🔎','🗂️','📝','🧩','💬'][i]} ${v}</strong><span>${['图片与词语配对','分辨四种传播途径','从选词过渡到自己填词','点击排列正确顺序','先写答案，再对照关键词'][i]}</span></button>`).join('')}<button onclick="review()"><strong>↻ 错题重练</strong><span>集中复习还没有掌握的内容</span></button></div>`}
function saveName(){if($('#name'))saved.name=$('#name').value.trim();persist()}
function study(n){let w=words[n];app.innerHTML=`<div class="study"><div class="row"><span class="pill">认词卡 ${n+1} / ${words.length}</span><span class="grow"></span><button onclick="home()">返回</button></div><div class="panel center"><div class="art" aria-label="${esc(w[2])}">${w[0]}</div><h1>${w[1]}</h1><h2>${w[2]}</h2><button id="show" onclick="$('#example').hidden=false;this.hidden=true">看例句与解释</button><div id="example" hidden><p><b>${w[3]}</b><br>${w[4]}</p><p class="small">遮住华文，试着自己说出意思。</p></div></div><div class="row"><button ${n===0?'disabled':''} onclick="study(${n-1})">上一张</button><button class="primary grow" onclick="${n<words.length-1?`study(${n+1})`:`begin('mixed')`}">${n<words.length-1?'下一张':'开始10题练习'}</button></div></div>`}
function begin(m){saveName();mode=m;isReview=false;let recent=saved.runs.slice(-2).flatMap(r=>r.ids||[]);function pick(t,n){let a=shuffle(bank.filter(q=>q.type===t));return [...a.filter(q=>!recent.includes(q.id)),...a.filter(q=>recent.includes(q.id))].slice(0,n)}deck=m==='mixed'?[...pick('picture',3),...pick('classify',3),...pick('fill',2),...pick('order',1),...pick('short',1)]:pick(m,10);pos=0;results=[];question()}
function wrongIds(){let states={};saved.runs.forEach(r=>r.answers.forEach(a=>{states[a.id]=a.ok}));return Object.keys(states).filter(k=>!states[k]).map(Number)}function review(){let ids=wrongIds();if(!ids.length){app.innerHTML='<div class="panel center"><h2>目前没有待复习的错题</h2><p>完成一轮练习后，错题会出现在这里。</p><button class="primary" onclick="begin(\'mixed\')">开始10题练习</button></div>';return}deck=shuffle(bank.filter(q=>ids.includes(q.id))).slice(0,10);pos=0;results=[];isReview=true;question()}
function question(){locked=false;chosen=[];let q=deck[pos];app.innerHTML=`<div class="study"><div class="row"><span class="pill">${types[q.type]}</span><span class="grow"></span><span>${pos+1} / ${deck.length}</span></div><div class="progress"><div style="width:${pos/deck.length*100}%"></div></div><div class="panel" style="margin-top:20px"><div class="art" aria-hidden="true">${q.icon}</div><h2>${esc(q.prompt)}</h2><div class="row"><button onclick="$('#hint').hidden=!$('#hint').hidden">华文提示</button></div><p class="hint" id="hint" hidden>${q.cn}</p><div id="answer"></div><div id="feedback" aria-live="polite"></div></div><p class="small center">不计时。先理解，再作答。</p></div>`;
if(q.type==='order'){$('#answer').innerHTML='<p>按顺序点击词卡；点击已选词卡可撤回。</p><div class="steps" id="selected"></div><div class="row" id="pool"></div><button class="primary" id="check" onclick="checkOrder()">检查顺序</button>';drawOrder()}
else if(q.type==='short'){$('#answer').innerHTML='<label for="written">先试着写一句马来文答案</label><input id="written" placeholder="可先写出你记得的关键词" maxlength="250"><button class="primary" style="margin-top:16px" onclick="showModel()">对照参考答案</button>'}
else if(q.type==='fill'){$('#answer').innerHTML='<label for="typed">填写缺少的马来文词语</label><input id="typed" autocomplete="off" placeholder="输入答案"><div class="row"><button class="primary" onclick="checkFill()">检查答案</button><button onclick="showChoices()">需要选词帮助</button></div><div id="choices"></div>';$('#typed').addEventListener('keydown',e=>{if(e.key==='Enter')checkFill()})}
else showChoices();}
function showChoices(){let q=deck[pos];let options=shuffle([q.answer,...shuffle(q.choices).slice(0,3)]);let target=q.type==='fill'?$('#choices'):$('#answer');target.innerHTML='<div class="options">'+options.map(x=>`<button data-val="${esc(x)}">${esc(x)}</button>`).join('')+'</div>';target.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!locked)finish(b.dataset.val===q.answer,b.dataset.val)})}
function checkFill(){if(locked)return;let v=$('#typed').value.trim();if(!v){$('#typed').focus();return}finish(v.toLowerCase()===deck[pos].answer.toLowerCase(),v)}
function drawOrder(){let q=deck[pos];$('#selected').innerHTML=chosen.map((x,i)=>`<button onclick="chosen.splice(${i},1);drawOrder()">${i+1}. ${x}</button>`).join('')||'<span class="small">你的顺序会显示在这里</span>';$('#pool').innerHTML=shuffle(q.answer.filter(x=>!chosen.includes(x))).map(x=>`<button data-step="${esc(x)}">${x}</button>`).join('');$('#pool').querySelectorAll('button').forEach(b=>b.onclick=()=>{chosen.push(b.dataset.step);drawOrder()})}
function checkOrder(){if(locked)return;if(chosen.length!==deck[pos].answer.length){$('#feedback').innerHTML='<p class="hint">请先选完所有步骤。</p>';return}finish(JSON.stringify(chosen)===JSON.stringify(deck[pos].answer),chosen.join(' → '))}
function showModel(){if(locked)return;let v=$('#written').value.trim();if(!v){$('#written').focus();return}locked=true;$('#answer').innerHTML=`<p><b>你的答案：</b>${esc(v)}</p><div class="hint"><b>参考答案</b><p>${deck[pos].answer}</p>${deck[pos].ex}</div><p>逐项对照关键词，再选择：</p><div class="row"><button class="primary" id="selfyes">关键词齐全</button><button id="selfno">还需要练习</button></div><p class="small">这题由学生对照自评，也可以请老师协助检查。</p>`;$('#selfyes').onclick=()=>finish(true,v,true);$('#selfno').onclick=()=>finish(false,v,true)}
function finish(ok,value,force=false){if(locked&&!force)return;locked=true;let q=deck[pos];results.push({id:q.id,ok,value});$('#answer').querySelectorAll('button,input').forEach(b=>b.disabled=true);$('#answer').querySelectorAll('[data-val]').forEach(b=>{if(b.dataset.val===q.answer)b.classList.add('correct')});$('#feedback').innerHTML=`<div class="feedback ${ok?'':'wrong'}"><b>${ok?'✓ 已掌握 / Bagus!':'再看一次，你可以学会。'}</b><p>正确答案：${esc(Array.isArray(q.answer)?q.answer.join(' → '):q.answer)}</p>${q.ex}</div><button class="primary" style="width:100%" onclick="next()">${pos===deck.length-1?'查看本轮结果':'下一题'}</button>`}
function next(){pos++;if(pos<deck.length)question();else end()}
function end(){let score=results.filter(r=>r.ok).length;saved.runs.push({name:saved.name||'学生',date:new Date().toISOString(),score,total:deck.length,ids:deck.map(q=>q.id),answers:results,review:isReview});saved.runs=saved.runs.slice(-100);persist();app.innerHTML=`<div class="study panel center"><span class="pill">本轮完成 / Selesai</span><div class="art">🌿 🛡️</div><h1>${score} / ${deck.length}</h1><p>${esc(saved.name||'同学')}，完成了这一轮。<br>简答题成绩包含你的自评。</p><p class="small">${storageOK?'记录已保存在这个浏览器。':'浏览器未允许保存，请先记下本次成绩。'}</p><div class="row"><button class="primary grow" onclick="review()">错题重练</button><button class="grow" onclick="begin('mixed')">新一轮10题</button></div><button onclick="records()">查看学习记录</button></div>`}
function records(){app.innerHTML=`<div class="panel"><div class="row"><h2 class="grow">学习记录</h2><button onclick="download()">导出记录</button></div><p class="small">仅记录目前浏览器内的练习，不会跨设备同步。简答题为自评。学生改名后，各次记录保留当时的名字。</p><div class="row"><span class="pill">已完成 ${saved.runs.length} 轮</span><span class="pill">待复习 ${wrongIds().length} 题</span></div>${saved.runs.length?[...saved.runs].reverse().map(r=>`<div class="record"><b>${esc(r.name)} · ${r.score} / ${r.total}</b> ${r.review?'（错题重练）':''}<br><small>${new Date(r.date).toLocaleString('zh-MY')}</small>${r.answers.filter(a=>!a.ok).map(a=>`<p class="small">待复习：${esc(bank[a.id].prompt)}<br>正确答案：${esc(Array.isArray(bank[a.id].answer)?bank[a.id].answer.join(' → '):bank[a.id].answer)}</p>`).join('')}</div>`).join(''):'<p>还没有完成记录。先开始一轮练习吧。</p>'}</div>`}
function download(){let blob=new Blob([JSON.stringify(saved,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Bab4-learning-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}home();
</script></html>
